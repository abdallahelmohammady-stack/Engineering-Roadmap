<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="خارطة طريق أقسام الهندسة">
<title>Engineering Roadmap</title>
<link rel="icon" href="favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode:'class',
  theme:{ extend:{
    fontFamily:{ sans:['Cairo','sans-serif'], mono:['IBM Plex Mono','monospace'] },
    colors:{ ink:{ 950:'#06131f', 900:'#0a1a2c', 800:'#0d2137', 700:'#12293f', 600:'#1b3650' } }

<style>
:root{
  --brand:#38bdf8; --brand2:#fbbf24;
  --paper:#0a1a2c; --line:rgba(120,180,230,.10); --line2:rgba(120,180,230,.05);
  --txt:#e8f1f8; --mut:#7f9bb3;
}
*{ -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 50% -10%, rgba(56,189,248,.08), transparent 55%),
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    linear-gradient(var(--line2) 1px, transparent 1px),
    linear-gradient(90deg, var(--line2) 1px, transparent 1px);
  background-size: 100% 100%, 130px 130px, 130px 130px, 26px 26px, 26px 26px;
  color:var(--txt);
}
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:#081522; }
::-webkit-scrollbar-thumb{ background:#1b3650; border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:#2a5170; }

/* ---- compass watermark ---- */
.compass{ position:fixed; left:-140px; bottom:-160px; width:520px; height:520px; opacity:.05; z-index:0; pointer-events:none; animation:spin 120s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }

/* ---- subtle professional background animation ---- */
.bg-anim{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-anim::before{ content:""; position:absolute; inset:-25%; background:radial-gradient(circle at 50% 50%, rgba(56,189,248,.10), transparent 45%); will-change:transform; animation:bg-drift 20s ease-in-out infinite; }
.bg-anim::after{ content:""; position:absolute; inset:-25%; background:radial-gradient(circle at 50% 50%, rgba(56,189,248,.06), transparent 40%); will-change:transform; animation:bg-drift 28s ease-in-out infinite reverse; }
@keyframes bg-drift{ 0%{ transform:translate(-7%,-5%) scale(1);} 50%{ transform:translate(7%,5%) scale(1.12);} 100%{ transform:translate(-7%,-5%) scale(1);} }
@media (prefers-reduced-motion: reduce){ .bg-anim::before,.bg-anim::after{ animation:none; } }

/* ---- top ruler strip ---- */
.ruler{
  height:14px;
  background:
    repeating-linear-gradient(90deg, rgba(120,180,230,.35) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(90deg, rgba(120,180,230,.55) 0 1px, transparent 1px 50px);
  border-bottom:1px solid rgba(120,180,230,.15);
}

/* ---- tabs ---- */
.tabs{ scrollbar-width:thin; }
.tab{
  position:relative; display:flex; align-items:center; gap:8px; white-space:nowrap;
  padding:9px 14px; border-radius:11px 11px 0 0; cursor:pointer;
  color:var(--mut); font-weight:700; font-size:13.5px;
  border:1px solid transparent; border-bottom:none; transition:.18s;
  background:transparent;
}
.tab:hover{ color:#dbeafe; background:rgba(56,189,248,.06); }
.tab.active{
  color:#fff; background:rgba(56,189,248,.10);
  border-color:rgba(120,180,230,.22);
  box-shadow: inset 0 3px 0 var(--acc,#38bdf8);
}
.tab .ic{ width:17px;height:17px; }
.tab-add{ border:1.5px dashed rgba(120,180,230,.35); color:var(--mut); }
.tab-add:hover{ color:#fff; border-color:var(--brand); background:rgba(56,189,248,.08); }
.tab-ctrl{ display:flex; gap:2px; margin-inline-start:2px; }
.tab-ctrl button{
  width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:#9fb6cb;background:rgba(255,255,255,.04);border:1px solid rgba(120,180,230,.14);transition:.15s;
}
.tab-ctrl button:hover{ color:#fff; background:rgba(56,189,248,.2); border-color:var(--brand); }
.tab-ctrl button.del:hover{ background:rgba(244,63,94,.2); border-color:#fb7185; color:#fecdd3; }

/* ---- sheets (partitions) ---- */
.sheet{
  position:relative; background:linear-gradient(180deg,#0d2137,#0b1c2e);
  border:1px solid rgba(120,180,230,.16); border-radius:16px; overflow:hidden;
  box-shadow:0 20px 50px -30px rgba(0,0,0,.8);
}
.sheet::before,.sheet::after{
  content:""; position:absolute; width:16px;height:16px; border:2px solid var(--acc,#38bdf8); opacity:.55; pointer-events:none;
}
.sheet::before{ top:8px; right:8px; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
.sheet::after{ bottom:8px; left:8px; border-right:none; border-top:none; border-radius:0 0 0 6px; }
.sheet-head{ border-top:3px solid var(--acc,#38bdf8); }

/* ---- partition cards ---- */
.partitions-grid{ display:grid; grid-template-columns:repeat(1,minmax(0,1fr)); gap:20px; }
@media (min-width:768px){ .partitions-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1280px){ .partitions-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.partition-card{ display:flex; flex-direction:column; min-width:0; transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.partition-card:hover{ transform:translateY(-4px); border-color:color-mix(in srgb, var(--acc,#38bdf8) 52%, transparent); box-shadow:0 25px 50px -30px rgba(0,0,0,.95); }
.partition-card .partition-body{ flex:1; }
.partition-cover{ height:208px; position:relative; overflow:hidden; border-bottom:1px solid rgba(120,180,230,.13); background:#0a1a2c; }
.partition-cover img{ width:100%; height:100%; object-fit:contain; opacity:.95; transition:transform .35s ease,opacity .2s ease; }
.partition-card:hover .partition-cover img{ transform:scale(1.03); opacity:1; }
.partition-cover::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(6,19,31,.5), transparent 70%), linear-gradient(0deg, #0d2137 5%, transparent 60%); }
.partition-cover .cover-icon{ position:absolute; z-index:1; right:18px; bottom:16px; width:52px; height:52px; border-radius:14px; display:grid; place-items:center; border:1px solid; backdrop-filter:blur(4px); }

/* ---- category cards (inside partitions) ---- */
.categories-grid{ display:grid; grid-template-columns:repeat(1,minmax(0,1fr)); gap:22px; }
@media (min-width:768px){ .categories-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.cat-card{ position:relative; background:linear-gradient(180deg,#0d2137,#0b1c2e); border:1px solid rgba(120,180,230,.16); border-radius:18px; overflow:hidden; box-shadow:0 18px 45px -30px rgba(0,0,0,.8); transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.cat-card:hover{ transform:translateY(-3px); border-color:color-mix(in srgb, var(--acc,#38bdf8) 52%, transparent); box-shadow:0 25px 55px -30px rgba(0,0,0,.95); }
.cat-card-head{ cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 18px; transition:.15s; border-top:3px solid var(--acc,#38bdf8); }
.cat-card-head:hover{ background:rgba(56,189,248,.05); }
.cat-card-body{ border-top:1px solid rgba(120,180,230,.1); background:rgba(0,0,0,.15); }
.cat-card-head .cat-chev{ transition:transform .2s ease; }
.cat-card-head.collapsed .cat-chev{ transform:rotate(0deg); }

/* ---- notes ---- */
.notes-section{ padding:18px 18px 20px; background:rgba(0,0,0,.22); }
.note-card{ background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025)); border:1px solid rgba(120,180,230,.18); border-left:3px solid var(--acc,#38bdf8); border-radius:12px; padding:15px 17px; box-shadow:0 10px 28px -20px rgba(0,0,0,.9); }
.note-card .note-text{ white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.75; color:#eaf2f8; }
.partition-card .cat-head{ padding:14px 15px; }
.partition-card .pillbtn{ padding-inline:10px; }


.stamp{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1px;
  color:var(--acc,#38bdf8); border:1.5px solid var(--acc,#38bdf8); border-radius:6px;
  padding:2px 8px; background:rgba(56,189,248,.06);
}

/* ---- accordion / rows ---- */
.cat-head{ cursor:pointer; user-select:none; transition:.15s; }
.cat-head:hover{ background:rgba(56,189,248,.05); }
.row{ transition:.15s; }
.row:hover{ background:rgba(56,189,248,.04); }

.chk{ width:22px;height:22px;border-radius:7px;border:1.5px solid #33506b; display:flex;align-items:center;justify-content:center;transition:.15s;color:transparent;flex-shrink:0; }
.chk:hover{ border-color:var(--acc,#38bdf8); }
.chk.done{ background:var(--acc,#38bdf8); border-color:var(--acc,#38bdf8); color:#04121e; }

/* ---- progress ring ---- */
.ring{ width:56px;height:56px;border-radius:50%; display:grid; place-items:center; flex-shrink:0;
  background:conic-gradient(var(--acc,#38bdf8) calc(var(--p)*1%), rgba(255,255,255,.08) 0); }
.ring > span{ width:42px;height:42px;border-radius:50%; background:#0b1c2e; display:grid; place-items:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#dbeafe; }

/* ---- buttons ---- */
.icobtn{ width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(120,180,230,.18);background:rgba(255,255,255,.03);color:#9fb6cb;transition:.15s; }
.icobtn:hover{ color:#fff; border-color:var(--brand); background:rgba(56,189,248,.14); }
.icobtn.del:hover{ border-color:#fb7185; background:rgba(244,63,94,.16); color:#fecdd3; }
.move{ width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(120,180,230,.16);color:#9fb6cb;transition:.15s; }
.move:hover:not(:disabled){ color:#fff; background:rgba(56,189,248,.2); border-color:var(--brand); }
.move:disabled{ opacity:.28; cursor:not-allowed; }

.pillbtn{ display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:12.5px;padding:8px 15px;border-radius:10px;transition:.18s;cursor:pointer; }
.pill-primary{ background:var(--brand); color:#04121e; box-shadow:0 8px 20px -8px rgba(56,189,248,.6); }
.pill-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.pill-ghost{ border:1px solid rgba(120,180,230,.25); color:#cfe3f3; }
.pill-ghost:hover{ border-color:var(--brand); color:#fff; background:rgba(56,189,248,.08); }

/* ---- modal ---- */
.mback{ background:rgba(3,10,18,.72); backdrop-filter:blur(5px); }
.field label{ display:block; font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:#7f9bb3; margin-bottom:7px; }
.field input,.field select,.field textarea{
  width:100%; background:#081522; border:1px solid rgba(120,180,230,.22); border-radius:10px;
  padding:11px 13px; color:#e8f1f8; font-size:14px; outline:none; transition:.15s; font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(56,189,248,.15); }
.colorchip{ width:34px;height:34px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.15s; }
.colorchip.sel{ border-color:#fff; transform:scale(1.08); }

.upl{ border:2px dashed rgba(120,180,230,.3); border-radius:12px; padding:18px; text-align:center; cursor:pointer; transition:.18s; }
.upl:hover{ border-color:var(--brand); background:rgba(56,189,248,.06); }
.upl.has{ border-style:solid; border-color:var(--brand); }

.fadein{ animation:fade .3s ease; }
@keyframes fade{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

.titleblock{ position:relative; overflow:hidden; }
.titleblock .diag{ position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(56,189,248,.03) 0 12px, transparent 12px 24px); pointer-events:none; }
</style>
</head>

<body class="min-h-screen font-sans overflow-x-hidden relative">
<div class="bg-anim" aria-hidden="true"></div>
<svg class="compass" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="none" stroke="#38bdf8" stroke-width="1"/><circle cx="100" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="1"/><g stroke="#38bdf8" stroke-width="1"><line x1="100" y1="5" x2="100" y2="195"/><line x1="5" y1="100" x2="195" y2="100"/><line x1="30" y1="30" x2="170" y2="170"/><line x1="170" y1="30" x2="30" y2="170"/></g><circle cx="100" cy="100" r="6" fill="#38bdf8"/></svg>

<!-- ============ TOP BAR ============ -->
<header class="fixed top-0 inset-x-0 z-40">
  <div class="bg-ink-900/95 backdrop-blur-md border-b border-[rgba(120,180,230,.16)]">
    <div class="max-w-[1400px] mx-auto px-3 sm:px-5 h-[62px] flex items-center gap-3">
      <!-- brand -->
      <div class="flex items-center gap-2.5 cursor-pointer shrink-0 group" onclick="go('home')">
        <div class="w-10 h-10 rounded-xl grid place-items-center bg-[rgba(56,189,248,.12)] border border-[rgba(56,189,248,.3)] group-hover:bg-[rgba(56,189,248,.2)] transition">
          <i data-lucide="compass" class="w-5 h-5 text-sky-400"></i>
        </div>
        <div class="hidden sm:block leading-tight">
          <div class="font-mono font-bold text-[15px] tracking-tight text-white">ENGINEERING<span class="text-sky-400">·</span>Roadmap</div>
          <div class="text-[9.5px] uppercase tracking-[.25em] text-[#7f9bb3] font-bold">خارطة أقسام الهندسة</div>
        </div>
      </div>

      <!-- tabs -->
      <nav id="tabs" class="tabs flex items-end gap-1.5 overflow-x-auto flex-1 self-stretch pt-2 px-1" style="scrollbar-width:thin"></nav>

      <!-- controls -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="admin-toggle" onclick="toggleAdmin()" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border border-[rgba(120,180,230,.3)] text-[11px] font-bold uppercase tracking-wider text-[#cfe3f3] hover:border-sky-400 hover:text-sky-400 transition">
          <i data-lucide="settings-2" class="w-4 h-4"></i><span id="admin-text">وضع المشاهد</span>
        </button>
        <button id="export-btn" onclick="exportFinal()" class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border border-[rgba(120,180,230,.3)] text-[11px] font-bold uppercase tracking-wider text-[#cfe3f3] hover:border-emerald-400 hover:text-emerald-400 transition">
          <i data-lucide="download" class="w-4 h-4"></i><span>تصدير نسخة</span>
        </button>
      </div>
    </div>
  </div>
  <div class="ruler"></div>
</header>

<main class="relative z-10 max-w-[1400px] mx-auto px-3 sm:px-5 pt-[112px] pb-28">
  <!-- HOME / OVERVIEW -->
  <section id="view-home" class="hidden fadein">
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 text-[11px] font-mono font-bold tracking-[.2em] text-sky-400 border border-[rgba(56,189,248,.3)] rounded-full px-4 py-1.5 mb-5 bg-[rgba(56,189,248,.06)]">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> SYSTEM · ONLINE
      </div>
      <h1 class="text-3xl md:text-5xl font-black mb-3 text-white">تخصصات الاقسام <span class="text-sky-400">الهندسية</span></h1>
      <p class="text-[#9fb6cb] max-w-xl mx-auto text-[15px]">اختر قسمًا من الشريط العلوي لبدء رحلتك. كل تعديلاتك تُحفظ تلقائيًا على جهازك.</p>
    </div>
    <div id="dept-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </section>

  <!-- DEPARTMENT PAGE -->
  <section id="view-dept" class="hidden fadein">
    <div id="dept-head"></div>
    <div class="flex items-center justify-between flex-wrap gap-3 my-6">
      <button onclick="go('home')" class="flex items-center gap-2 text-[12px] font-bold text-[#9fb6cb] hover:text-sky-400 transition uppercase tracking-wide">
        <i data-lucide="arrow-right" class="w-4 h-4"></i> رجوع للرئيسية
      </button>
      <button id="add-part-btn" onclick="addPartition()" class="pillbtn pill-primary">
        <i data-lucide="layout-panel-top" class="w-4 h-4"></i> إضافة بارتيشن
      </button>
    </div>
    <div id="partitions" class="partitions-grid"></div>
  </section>

  <!-- PARTITION DETAILS -->
  <section id="view-partition" class="hidden fadein">
    <div id="partition-detail"></div>
  </section>

  <!-- CATEGORY DETAILS -->
  <section id="view-category" class="hidden fadein">
    <div id="category-detail"></div>
  </section>
</main>

<footer class="fixed bottom-0 inset-x-0 z-30 bg-ink-900/95 backdrop-blur-md border-t border-[rgba(120,180,230,.16)] py-3">
  <div class="max-w-[1400px] mx-auto px-4 flex items-center justify-center gap-4 text-[10.5px] font-mono uppercase tracking-widest text-[#7f9bb3]">
    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> النظام يعمل</span>
    <span class="opacity-40">|</span>
    <span>Made By Abdalllah Elmohammady</span>
    <span class="opacity-40">|</span>
    <button id="reset-btn" onclick="resetData()" class="hover:text-rose-400 transition">إعادة ضبط</button>
  </div>
</footer>

<!-- ============ MODAL ============ -->
<div id="modal" class="fixed inset-0 z-[100] hidden">
  <div class="absolute inset-0 mback" onclick="closeModal()"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] max-w-lg max-h-[90vh] overflow-y-auto bg-ink-800 border border-[rgba(120,180,230,.22)] rounded-2xl shadow-2xl p-6 sm:p-7">
    <h3 id="modal-title" class="text-xl font-black mb-5 text-white flex items-center gap-2 pb-4 border-b border-[rgba(120,180,230,.16)]"></h3>
    <form id="crud-form" onsubmit="submitForm(event)" class="space-y-4">
      <input type="hidden" id="f-type"><input type="hidden" id="f-id"><input type="hidden" id="f-parent"><input type="hidden" id="f-img">
      <div id="modal-fields" class="space-y-4"></div>
      <div class="flex justify-end gap-3 pt-4">
        <button type="button" onclick="closeModal()" class="pillbtn pill-ghost">إلغاء</button>
        <button type="submit" class="pillbtn pill-primary"><i data-lucide="save" class="w-4 h-4"></i> حفظ</button>
      </div>
    </form>
  </div>
</div>

const STORAGE_KEY = 'engBlueprintData_Roadmaps_v1';
const safeOriginal = originalDepartments || defaultDepartments;

let depts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(safeOriginal));
let current = 'home';      // 'home' or dept id
let currentPartition = null; // selected partition id
let currentCategory = null; // selected category id
let isAdmin = false;
let collapsed = {};        // category/partition collapse state
let tempImg = null;

/* ============================ HELPERS ============================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $ = id => document.getElementById(id);
const save = () => { localStorage.setItem(STORAGE_KEY, JSON.stringify(depts)); render(); };
const acc = c => COLORS[c] || COLORS.sky;

function stats(node){
  let t=0,d=0;
  const walkCats = cats => cats.forEach(cat=>{
    (cat.courses||[]).forEach(co=>{ t++; if(co.completed) d++; });
    if(cat.subCategories) walkCats(cat.subCategories);
  });
  if(node.partitions) node.partitions.forEach(p=>walkCats(p.categories||[]));
  else if(node.categories) walkCats(node.categories);
  else if(node.courses||node.subCategories) walkCats([node]);
  return { t, d, pct: t? Math.round(d/t*100):0 };
}

// locate any node by id -> {node, arr, index, kind}
function locate(id){
  for(let i=0;i<depts.length;i++){ if(depts[i].id===id) return {node:depts[i], arr:depts, index:i, kind:'dept'}; }
  for(const dep of depts) for(let i=0;i<(dep.partitions||[]).length;i++){
    if(dep.partitions[i].id===id) return {node:dep.partitions[i], arr:dep.partitions, index:i, kind:'partition', dept:dep};
  }
  for(const dep of depts) for(const part of (dep.partitions||[])) for(let i=0;i<(part.categories||[]).length;i++){
    if(part.categories[i].id===id) return {node:part.categories[i], arr:part.categories, index:i, kind:'category', part, dept:dep};
  }
  for(const dep of depts) for(const part of (dep.partitions||[])) for(const cat of (part.categories||[])) for(let i=0;i<(cat.subCategories||[]).length;i++){
    if(cat.subCategories[i].id===id) return {node:cat.subCategories[i], arr:cat.subCategories, index:i, kind:'subcategory', cat, part, dept:dep};
  }
  for(const dep of depts) for(const part of (dep.partitions||[])) for(const cat of (part.categories||[])){
    const arrs=[cat.courses, ...(cat.subCategories||[]).map(s=>s.courses)];
    for(const a of arrs){ if(!a) continue; const idx=a.findIndex(c=>c.id===id); if(idx>-1) return {node:a[idx], arr:a, index:idx, kind:'course'}; }
  }
  return null;
}
function findNode(id){ const r=locate(id); return r?r.node:null; }
const uid = p => p + '_' + Date.now() + Math.floor(Math.random()*999);

/* ============================ ROUTING ============================ */
function go(target){ currentPartition=null; currentCategory=null; current=target; history.pushState(null,'', target==='home'? location.pathname : location.pathname+'#'+target); render(); window.scrollTo({top:0}); }
function openPartition(id){ const r=locate(id); if(!r || r.kind!=='partition') return; current=r.dept.id; currentPartition=id; currentCategory=null; history.pushState(null,'',location.pathname+'#'+current+'/'+id); render(); window.scrollTo({top:0}); }
function openCategory(id){ const r=locate(id); if(!r || r.kind!=='category') return; current=r.dept.id; currentPartition=r.part.id; currentCategory=id; history.pushState(null,'',location.pathname+'#'+current+'/'+currentPartition+'/'+id); render(); window.scrollTo({top:0}); }
window.addEventListener('popstate', ()=>{ const [deptId, partId, catId]=location.hash.replace('#','').split('/'); current=(deptId && depts.find(d=>d.id===deptId))?deptId:'home'; currentPartition=(partId && locate(partId)?.kind==='partition')?partId:null; currentCategory=(catId && locate(catId)?.kind==='category')?catId:null; render(); });

/* ============================ ADMIN / RESET ============================ */
function toggleAdmin(){
  isAdmin=!isAdmin;
  $('admin-text').innerText = isAdmin? 'وضع الأدمن' : 'وضع المشاهد';
  $('admin-toggle').classList.toggle('border-sky-400', isAdmin);
  $('admin-toggle').classList.toggle('text-sky-400', isAdmin);
  render();
}
function resetData(){
  if(confirm('هل أنت متأكد من إعادة ضبط كل البيانات؟ سيتم حذف جميع تعديلاتك.')){ localStorage.removeItem(STORAGE_KEY); location.reload(); }
}

/* ============================ MOVE / DELETE / COMPLETE ============================ */
function move(id, dir){
  const r=locate(id); if(!r) return;
  const ni=r.index+dir; if(ni<0||ni>=r.arr.length) return;
  [r.arr[r.index], r.arr[ni]] = [r.arr[ni], r.arr[r.index]];
  save();
}
function del(id){
  const r=locate(id); if(!r) return;
  if(!confirm('هل أنت متأكد من الحذف؟')) return;
  r.arr.splice(r.index,1);
  if(r.kind==='dept' && current===id){ current='home'; }
  save();
}
function toggleCourse(id){
  const r=locate(id); if(!r||r.kind!=='course') return;
  r.node.completed=!r.node.completed; save();
}
function toggleCollapse(id){
  const isCat = String(id).indexOf('C_')===0;
  const cur = isCat ? (collapsed[id] !== false) : !!collapsed[id];
  collapsed[id] = !cur;
  render();
}

/* ============================ EXPORT ============================ */
function exportFinal(){
  try{
    const btn=$('export-btn'); const orig=btn.innerHTML;
    btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>جارٍ...</span>'; lucide.createIcons();
    const dataString = JSON.stringify(depts, null, 4);
    let html = document.documentElement.outerHTML;
    const target = "const originalDepartments = null; // EXPORT_TARGET";
    const replacement = "const originalDepartments = " + dataString + "; // EXPORT_TARGET";
    if(!html.includes(target)){ alert('خطأ: تعذر العثور على هدف التصدير في الكود.'); btn.innerHTML=orig; lucide.createIcons(); return; }
    html = html.replace(target, replacement);
    html = html.replace(/const STORAGE_KEY = ['"][^'"]*['"];/, "const STORAGE_KEY = 'engBlueprint_Exported_" + Date.now() + "';");
    html = html.replace(/<button[^>]*id=["']admin-toggle["'][^>]*>[\s\S]*?<\/button>/g, '');
    html = html.replace(/<button[^>]*id=["']export-btn["'][^>]*>[\s\S]*?<\/button>/g, '');
    html = html.replace(/<button[^>]*id=["']reset-btn["'][^>]*>[\s\S]*?<\/button>/g, '');
    const blob=new Blob(['<!DOCTYPE html>\n'+html], {type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='Engineering_Roadmap_'+new Date().toISOString().slice(0,10)+'.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    btn.innerHTML=orig; lucide.createIcons();
  }catch(e){ console.error(e); alert('فشل التصدير. راجع الـ console.'); }
}

const colorOptions = () => Object.keys(COLORS).map(k=>({val:k,txt:k}));
const iconOptions = () => ICONS.map(i=>({val:i,txt:i}));

function openModal(type, id=null, parentId=null){
  const fields=$('modal-fields'); $('modal-fields').innerHTML='';
  tempImg=null;
  $('f-type').value=type; $('f-id').value=id||''; $('f-parent').value=parentId||current||'';
  let data = id ? (findNode(id)||{}) : {};
  if(type==='note' && id){ const c=findNode(parentId); data = (c&&c.notes)? (c.notes.find(n=>n.id===id)||{}) : {}; }
  $('f-img').value = data.image||'';
  const titleIcon = ({dept:'building-2',partition:'layout-panel-top',category:'folder',subcategory:'git-branch',course:'book-open',note:'sticky-note'}[type]);
  $('modal-title').innerHTML = `<i data-lucide="${titleIcon}" class="w-6 h-6 shrink-0" style="color:var(--brand)"></i><span>${(id?'تعديل ':'إضافة ') + ({dept:'قسم',partition:'بارتيشن',category:'تصنيف',subcategory:'تصنيف فرعي',course:'كورس',note:'ملاحظة'}[type])}</span>`;

  const inp=(label,key,ph='',type2='text')=>`<div class="field"><label>${label}</label><input type="${type2}" name="${key}" value="${esc(data[key]??'')}" placeholder="${ph}"></div>`;
  const ta=(label,key,ph='')=>`<div class="field"><label>${label}</label><textarea name="${key}" rows="2" placeholder="${ph}">${esc(data[key]??'')}</textarea></div>`;
  const sel=(label,key,opts)=>`<div class="field"><label>${label}</label><select name="${key}">${opts.map(o=>`<option value="${o.val}" ${data[key]===o.val?'selected':''}>${o.txt}</option>`).join('')}</select></div>`;
  const colorSel=(key)=>{
    const cur=data[key]||'sky';
    return `<div class="field"><label>اللون</label><input type="hidden" name="${key}" id="color-input" value="${cur}">
      <div class="flex flex-wrap gap-2">${colorOptions().map(o=>`<div class="colorchip ${cur===o.val?'sel':''}" style="background:${COLORS[o.val]}" onclick="pickColor('${o.val}')"></div>`).join('')}</div></div>`;
  };
  const iconSel=(key)=>{
    const cur=data[key]||ICONS[0];
    const prvCol=(document.getElementById('color-input') && document.getElementById('color-input').value)||'sky';
    const prvBg=(COLORS[prvCol]||'#38bdf8')+'22', prvFg=COLORS[prvCol]||'#38bdf8';
    return `<div class="field"><label>الأيقونة</label><input type="hidden" name="${key}" id="icon-input" value="${cur}">
      <div class="flex items-center gap-3 mb-3 p-3 rounded-xl border border-[rgba(120,180,230,.2)] bg-[rgba(255,255,255,.03)]">
        <div id="icon-preview" class="w-12 h-12 rounded-xl grid place-items-center shrink-0" style="background:${prvBg};color:${prvFg}"><i data-lucide="${cur}" class="w-7 h-7"></i></div>
        <div class="text-[12px] text-[#9fb6cb] font-mono" id="icon-preview-name">${cur}</div>
      </div>
      <div class="flex flex-wrap gap-1.5">${iconOptions().map(o=>`<div onclick="pickIcon('${o.val}')" class="iconchip w-9 h-9 rounded-lg grid place-items-center cursor-pointer border transition ${cur===o.val?'border-sky-400 bg-[rgba(56,189,248,.15)]':'border-[rgba(120,180,230,.18)] bg-[rgba(255,255,255,.03)] hover:border-sky-400'}" data-ic="${o.val}"><i data-lucide="${o.val}" class="w-4 h-4"></i></div>`).join('')}</div></div>`;
  };

  if(type==='dept'){
    fields.innerHTML = inp('اسم القسم','title','مثال: الهندسة المدنية') + inp('العنوان الفرعي','subtitle','Civil Engineering') + ta('الوصف','description') + colorSel('color') + iconSel('icon');
  } else if(type==='partition'){
    const curImg=data.image||'';
    fields.innerHTML = inp('اسم البارتيشن','title') + inp('العنوان الفرعي','subtitle') + ta('الوصف','description') + colorSel('color') + iconSel('icon') +
      `<div class="field"><label>صورة الغلاف</label>
        <div id="upload-area" class="upl ${curImg?'has':''}" onclick="$('img-upload').click()">
          <input type="file" id="img-upload" accept="image/*" class="hidden" onchange="handleImg(event)">
          <img id="image-preview" src="${curImg}" class="${curImg?'':'hidden'} w-full h-40 object-cover rounded-lg mb-1">
          <div id="image-placeholder" class="${curImg?'hidden':''} py-6"><i data-lucide="image-plus" class="w-8 h-8 mx-auto text-[#7f9bb3] mb-2"></i><p class="text-sm text-[#9fb6cb]">اضغط لرفع صورة</p><p class="text-xs text-[#7f9bb3] mt-1">PNG / JPG / WEBP</p></div>
        </div>
        <button type="button" onclick="removeImg()" class="mt-2 text-xs text-rose-400 hover:underline ${curImg?'':'hidden'}" id="remove-img-btn">حذف الصورة</button>
      </div>`;
  } else if(type==='category' || type==='subcategory'){
    fields.innerHTML = inp('اسم التصنيف','title') + iconSel('icon');
  } else if(type==='course'){
    fields.innerHTML = inp('اسم الكورس','title') + inp('رابط المصدر','link','https://...','url');
  } else if(type==='note'){
    fields.innerHTML = `<div class="field"><label>نص الملاحظة</label><textarea name="text" rows="4" placeholder="اكتب ملاحظتك هنا...">${esc(data.text||'')}</textarea></div>`;

function pickColor(v){ $('color-input').value=v; document.querySelectorAll('.colorchip').forEach(c=>c.classList.remove('sel')); event.target.classList.add('sel'); const prev=$('icon-preview'); if(prev){ prev.style.background=(COLORS[v]||'#38bdf8')+'22'; prev.style.color=COLORS[v]||'#38bdf8'; } }
function pickIcon(v){ $('icon-input').value=v; document.querySelectorAll('.iconchip').forEach(c=>{c.classList.remove('border-sky-400','bg-[rgba(56,189,248,.15)]');c.classList.add('border-[rgba(120,180,230,.18)]');}); const el=document.querySelector(`.iconchip[data-ic="${v}"]`); if(el){el.classList.add('border-sky-400','bg-[rgba(56,189,248,.15)]');el.classList.remove('border-[rgba(120,180,230,.18)]');} const prev=$('icon-preview'); if(prev){ const col=(document.getElementById('color-input')&&document.getElementById('color-input').value)||'sky'; prev.style.background=(COLORS[col]||'#38bdf8')+'22'; prev.style.color=COLORS[col]||'#38bdf8'; prev.innerHTML=`<i data-lucide="${v}" class="w-7 h-7"></i>`; const nm=$('icon-preview-name'); if(nm) nm.innerText=v; lucide.createIcons(); } }
function handleImg(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{ tempImg=ev.target.result; $('image-preview').src=tempImg; $('image-preview').classList.remove('hidden'); $('image-placeholder').classList.add('hidden'); $('upload-area').classList.add('has'); $('remove-img-btn').classList.remove('hidden'); }; r.readAsDataURL(f);
}
function removeImg(){ tempImg='REMOVED'; $('image-preview').classList.add('hidden'); $('image-preview').src=''; $('image-placeholder').classList.remove('hidden'); $('upload-area').classList.remove('has'); $('remove-img-btn').classList.add('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); tempImg=null; }

function submitForm(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const type=$('f-type').value, id=$('f-id').value, parent=$('f-parent').value;
  const curImg=$('f-img').value;

  if(type==='dept'){
    if(id){ const d=findNode(id); if(d){ d.title=fd.get('title')||d.title; d.subtitle=fd.get('subtitle')||''; d.description=fd.get('description')||''; d.color=fd.get('color')||d.color; d.icon=fd.get('icon')||d.icon; } }
    else depts.push({ id:uid('dep'), title:fd.get('title')||'قسم جديد', subtitle:fd.get('subtitle')||'', description:fd.get('description')||'', color:fd.get('color')||'sky', icon:fd.get('icon')||'boxes', partitions:[] });
  }
  else if(type==='partition'){
    let img = curImg||defaultImage; if(tempImg==='REMOVED') img=defaultImage; else if(tempImg) img=tempImg;
    const dep=findNode(parent); if(!dep){ alert('القسم غير موجود'); closeModal(); return; }
    if(id){ const p=findNode(id); if(p){ p.title=fd.get('title')||p.title; p.subtitle=fd.get('subtitle')||''; p.description=fd.get('description')||''; p.color=fd.get('color')||p.color; p.icon=fd.get('icon')||p.icon; p.image=img; } }
    else { if(!dep.partitions) dep.partitions=[]; dep.partitions.push({ id:uid('part'), title:fd.get('title')||'بارتيشن جديد', subtitle:fd.get('subtitle')||'', description:fd.get('description')||'', color:fd.get('color')||dep.color, icon:fd.get('icon')||'layers', image:img, categories:[] }); }
  }
  else if(type==='category'){
    const part=findNode(parent); if(!part){ alert('البارتيشن غير موجود'); closeModal(); return; }
    if(id){ const c=findNode(id); if(c){ c.title=fd.get('title')||c.title; c.icon=fd.get('icon')||c.icon; } }
    else { if(!part.categories) part.categories=[]; part.categories.push({ id:uid('cat'), title:fd.get('title')||'تصنيف جديد', icon:fd.get('icon')||'folder', courses:[] }); }
  }
  else if(type==='subcategory'){
    const cat=findNode(parent); if(!cat){ alert('التصنيف غير موجود'); closeModal(); return; }
    if(id){ const s=findNode(id); if(s){ s.title=fd.get('title')||s.title; s.icon=fd.get('icon')||s.icon; } }
    else { if(!cat.subCategories) cat.subCategories=[]; cat.subCategories.push({ id:uid('sub'), title:fd.get('title')||'تصنيف فرعي جديد', icon:fd.get('icon')||'folder', courses:[] }); }
  }
  else if(type==='course'){
    const cat=findNode(parent); if(!cat){ alert('التصنيف غير موجود'); closeModal(); return; }
    if(!cat.courses) cat.courses=[];
    if(id){ const c=findNode(id); if(c){ c.title=fd.get('title')||c.title; c.link=fd.get('link')||c.link; } }
    else cat.courses.push({ id:uid('cou'), title:fd.get('title')||'كورس جديد', link:fd.get('link')||'#', completed:false });
  }
  else if(type==='note'){
    const cat=findNode(parent); if(!cat){ alert('التصنيف غير موجود'); closeModal(); return; }
    if(!cat.notes) cat.notes=[];
    const text=(fd.get('text')||'').trim();
    if(!text){ alert('من فضلك اكتب نص الملاحظة'); return; }
    if(id){ const n=cat.notes.find(x=>x.id===id); if(n) n.text=text; }
    else cat.notes.push({ id:uid('note'), text, date:new Date().toISOString() });
  }
  save(); closeModal();
}

function fmtDate(s){
  try{ const d=new Date(s);
    return d.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function addNote(catId){ openModal('note', null, catId); }
function editNote(catId, noteId){ openModal('note', noteId, catId); }
function delNote(catId, noteId){
  const cat=findNode(catId); if(!cat||!cat.notes) return;
  if(!confirm('هل أنت متأكد من حذف الملاحظة؟')) return;
  cat.notes=cat.notes.filter(n=>n.id!==noteId);
  save();
}
function renderNotes(cat, pc){
  const sec=document.createElement('div');
  sec.className='notes-section';
  const notes=cat.notes||[];
  let html=`<div class="flex items-center justify-between gap-2 mb-3">
      <div class="flex items-center gap-2 text-[13px] font-bold" style="color:${pc}"><i data-lucide="sticky-note" class="w-4 h-4"></i> الملاحظات <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-[rgba(255,255,255,.06)] text-[#9fb6cb]">${notes.length}</span></div>
      <button onclick="addNote('${cat.id}')" class="pillbtn pill-ghost !py-1.5 !text-[12px]" style="color:${pc};border-color:${pc}55"><i data-lucide="plus" class="w-4 h-4"></i> إضافة ملاحظة</button>
    </div>`;
  if(!notes.length){
    html+=`<div class="text-center text-[#7f9bb3] text-[13px] italic py-1">لا توجد ملاحظات بعد.</div>`;
  } else {
    html+='<div class="space-y-2.5">';
    notes.forEach(n=>{
      html+=`<div class="note-card">
        <p class="note-text text-[13.5px] text-[#e8f1f8] leading-relaxed">${esc(n.text)}</p>
        ${n.date?`<div class="text-[10px] font-mono text-[#7f9bb3] mt-2">${fmtDate(n.date)}</div>`:''}
        <div class="flex items-center gap-3 mt-2 pt-2 border-t border-[rgba(120,180,230,.1)]">
          <button class="text-[12px] font-bold flex items-center gap-1.5 text-[#9fb6cb] hover:text-sky-400 transition" onclick="editNote('${cat.id}','${n.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i> تعديل</button>
          <button class="text-[12px] font-bold flex items-center gap-1.5 text-rose-400 hover:text-rose-300 transition" onclick="delNote('${cat.id}','${n.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i> حذف</button>
        </div>
      </div>`;
    });
    html+='</div>';
  }
  sec.innerHTML=html;
  return sec;
}

function render(){
  renderTabs();
  const home=$('view-home'), dept=$('view-dept'), partition=$('view-partition'), category=$('view-category');
  home.classList.add('hidden'); dept.classList.add('hidden'); partition.classList.add('hidden'); category.classList.add('hidden');
  if(current==='home'){ home.classList.remove('hidden'); renderHome(); }
  else if(currentCategory){ category.classList.remove('hidden'); renderCategoryDetail(); }
  else if(currentPartition){ partition.classList.remove('hidden'); renderPartition(); }
  else { dept.classList.remove('hidden'); renderDept(); }
  lucide.createIcons();
}
